<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#032b40"><title>Przypominajka v1003</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="style.css"></head><body><main><header><span>🔔</span><b>Przypominajka</b><span class="gear">⚙️</span><small>v1003</small></header><nav><button onclick="show('list')">Moje przypomnienia</button><button onclick="show('history')">Historia</button><button onclick="show('settings')">Ustawienia</button></nav>
<section id="list"><button class="add" onclick="newReminder()">＋ Dodaj przypomnienie</button><button id="installBtn" class="install" hidden onclick="installApp()">📱 Zainstaluj na telefonie</button><div id="cards"></div></section>
<section id="form" hidden><h2 id="formTitle">← &nbsp; Dodaj przypomnienie</h2><label>Nazwa przypomnienia<input id="name" value="Weź pigułkę"></label><label>Kategoria</label><div class="categories" id="categories"><button data-cat="Leki" class="selected">💊<span>Leki</span></button><button data-cat="Nawodnienie">💧<span>Nawodnienie</span></button><button data-cat="Dom">🏠<span>Dom</span></button><button data-cat="Wizyta">🧑‍⚕️<span>Wizyta</span></button><button data-cat="Urodziny">🎂<span>Urodziny</span></button><button data-cat="Inne">⚙️<span>Inne</span></button></div><label>Ważność<select id="priority"><option value="critical">Bardzo ważne</option><option value="high">Ważne</option><option value="normal" selected>Normalne</option><option value="low">Niskie</option></select></label><label>Godzina<input id="time" type="time" value="20:00"></label><label>Powtarzanie<select id="repeat"><option>Codziennie</option><option>Jednorazowo</option><option>Wybrane dni tygodnia</option></select></label><div class="days"><button>Pn</button><button>Wt</button><button>Śr</button><button>Cz</button><button>Pt</button><button>So</button><button>Nd</button></div><label class="switchline">🔔 Dźwięk alarmu <input id="sound" type="checkbox" checked></label><label class="switchline">🔊 Komunikat głosowy <input id="speech" type="checkbox" checked></label><label>Tekst głosowy<input id="voice" value="Weź pigułkę, weź pigułkę"></label><div class="test-buttons"><button class="voice-test" onclick="previewVoice()">🔊 Test głosu</button><button class="alarm-test" onclick="previewAlarm()">🔔 Test alarmu</button></div><div class="row"><button class="save" onclick="save()"><span id="saveLabel">Zapisz przypomnienie</span></button><button class="cancel" onclick="show('list')">Anuluj</button></div></section>
<section id="history" hidden><h2>← &nbsp; Historia</h2><div class="filters"><button>Wszystkie</button><button>Wykonane</button><button>Pominięte</button></div><div id="hist"></div></section><section id="settings" hidden><h2>Ustawienia</h2><div class="settingsCard">🔊 Głos: polski<br><br>⏰ Domyślne odłożenie: 10 minut<br><br>📱 Wersja: v1003<br><br><button id="settingsInstall" class="install" onclick="installApp()">📲 Zainstaluj aplikację</button></div></section>
<section id="alarm" hidden class="alarm critical"><div class="alarmBell">🔔</div><h3>PRZYPOMNIENIE</h3><div id="alarmIcon" class="alarmIcon">💊</div><h1 id="alarmName">WEŹ PIGUŁKĘ</h1><strong id="alarmTime">20:00</strong><div id="alarmRepeat">Codziennie</div><p id="alarmVoice">🔊 „Weź pigułkę, weź pigułkę”</p><div class="row alarmActions"><button class="done" onclick="done()">✓<br>ZROBIONE</button><button class="snooze" onclick="snooze()">◷<br>PRZYPOMNIJ<br>ZA 10 MIN</button></div></section></main><script src="app.js"></script></body></html>
